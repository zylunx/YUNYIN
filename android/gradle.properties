org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 下面两个 flag 只在 AGP 9+ 生效（Flutter 迁移器写入的兼容开关）；主工程固定在 AGP 8.13.0
# 时它们会被忽略，保留是为了将来升级 AGP 9 时不用再补。
android.newDsl=false
android.builtInKotlin=false
# 部分插件（flutter_js）自带 Java 11 目标而 Kotlin 用默认 1.8，KGP 会因此直接中断构建。
# 两者都跑在 ART 上、字节码版本不同不影响运行，这里降级为警告，而不是去改 JavaCompile 的
# target（那会让 AGP 的 android.jar 从 -bootclasspath 里丢失，见 build.gradle.kts 注释）。
kotlin.jvm.target.validation.mode=warning
