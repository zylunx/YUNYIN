name: 构建

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: 版本号
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  audio:
    name: 音频验证
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: 安装 libmpv 与 Linux 桌面依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev pulseaudio pulseaudio-utils xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: 准备虚拟声卡与 libmpv
        run: |
          # runner 没有声卡：起一个 null sink 接住音频输出（AO=null 时不走声卡）。
          pulseaudio -D --exit-idle-time=-1 --start || true
          pactl load-module module-null-sink sink_name=ci_null || true
          pactl set-default-sink ci_null || true
          lib="$(ldconfig -p | grep -m1 -o '/[^ ]*libmpv\.so[^ ]*' || true)"
          echo "libmpv=${lib:-使用 media_kit 自带库}"
          echo "LIBMPV=$lib" >> "$GITHUB_ENV"
      - name: 音频链路（本地音源真实解码，含音量均衡与淡入淡出）
        run: xvfb-run -a flutter test integration_test -d linux --dart-define=AO=null
      # 在线音源受版权与网络影响，失败只报警不拦截（海外 runner 常被限制）。
      - name: 网易云在线音源真实播放
        continue-on-error: true
        run: flutter test --run-skipped --tags live --dart-define="LIBMPV=${LIBMPV:-}" test/live_playback_test.dart

  android:
    name: Android（arm64-v8a / 通用）
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 发布签名
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 所有版本必须使用同一把密钥签名，新版本才能覆盖安装。
          if [ -z "$KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::发布版本需要配置 ANDROID_KEYSTORE_BASE64 与 ANDROID_KEYSTORE_PASSWORD（见 tool/android/set_signing_secrets.sh）"; exit 1; fi
            echo "::warning::未配置发布密钥，本次构建使用调试签名"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          { echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"; echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"; } >> "$GITHUB_ENV"
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - run: flutter build apk --release
      - name: 整理产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/YunYin-$VERSION-android-universal.apk"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "dist/YunYin-$VERSION-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: YunYin-android
          path: dist/*

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: 更新说明（取自 CHANGELOG.md，同时显示在应用内更新弹窗中）
        run: |
          v="${GITHUB_REF#refs/tags/v}"
          awk -v v="$v" '/^## /{p = ($2 == "v" v)} p' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || echo "云音 v$v" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
